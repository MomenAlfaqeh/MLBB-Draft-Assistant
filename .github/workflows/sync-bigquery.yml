name: Sync BigQuery to SQLite

on:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd mlbb-draft-assistant
        pip install -r requirements.txt

    - name: Run BigQuery sync
      env:
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
      run: |
        cd mlbb-draft-assistant
        python scripts/sync_bigquery.py

    - name: Commit and push updated SQLite database
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add mlbb-draft-assistant/database/mlbb.db
        git diff --staged --quiet || (git commit -m "Auto-sync: Update SQLite database from BigQuery" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
