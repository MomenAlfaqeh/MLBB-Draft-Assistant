<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Draft Assistant</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#00ff41">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #00ff41;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff41;
        }
        .header h1 { font-size: 1.5em; letter-spacing: 3px; }
        .header p { font-size: 0.8em; opacity: 0.7; letter-spacing: 2px; }
        .section {
            background: #1a1a2e;
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }
        .section-title {
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 5px;
        }
        /* Ban slots mobile fix */
        .ban-slots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .ban-slot input {
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            overflow: hidden;
            box-sizing: border-box;
        }

        @media (min-width: 600px) {
            .ban-slots {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        input[type="text"] {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            outline: none;
            transition: box-shadow 0.3s;
        }
        input[type="text"]:focus {
            box-shadow: 0 0 10px #00ff41;
        }
        input[type="text"]::placeholder {
            color: #00ff4150;
        }
        .picks-container {
            display: flex;
            gap: 15px;
        }
        .picks-column {
            flex: 1;
        }
        .picks-column input {
            width: 100%;
            margin-bottom: 8px;
        }
        .analyze-btn {
            width: 100%;
            padding: 15px;
            background: #0a0a0a;
            border: 2px solid #00ff41;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }
        .analyze-btn:hover {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 30px #00ff41;
        }
        .analyze-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .results {
            display: none;
            margin-top: 20px;
        }
        .results.visible {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-card {
            background: #1a1a2e;
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }
        .hero-name {
            font-size: 1.3em;
            color: #00ff41;
            margin-bottom: 8px;
            text-shadow: 0 0 5px #00ff41;
        }
        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .role-Tank { background: #4a5568; color: #fff; }
        .role-Fighter { background: #e53e3e; color: #fff; }
        .role-Assassin { background: #805ad5; color: #fff; }
        .role-Marksman { background: #38a169; color: #fff; }
        .role-Mage { background: #3182ce; color: #fff; }
        .role-Support { background: #d69e2e; color: #fff; }
        .score-bar {
            width: 100%;
            height: 20px;
            background: #0a0a0a;
            border: 1px solid #00ff41;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff41, #00cc33);
            transition: width 1s ease-out;
            box-shadow: 0 0 10px #00ff41;
        }
        .breakdown {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 0.75em;
            margin-top: 8px;
            opacity: 0.8;
        }
        .breakdown-item { padding: 3px 0; }
        .matchup-section {
            margin-top: 20px;
            text-align: center;
        }
        .matchup-title {
            font-size: 0.9em;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .win-progress {
            width: 100%;
            height: 30px;
            background: #e53e3e;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #00ff41;
        }
        .win-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff41, #00cc33);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0a0a0a;
            transition: width 1s ease-out;
        }
        .spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner.visible { display: block; }
        .spinner::after {
            content: '';
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #1a1a2e;
            border-top: 4px solid #00ff41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>MLBB DRAFT ASSISTANT</h1>
        <p>AI LINEUP DRAFTER</p>
    </div>

    <div class="section card">
        <div class="section-title">ALLY BANS</div>
        <div class="ban-slots">
            <div class="ban-slot"><input type="text" placeholder="Hero 1" id="ally-ban-1"></div>
            <div class="ban-slot"><input type="text" placeholder="Hero 2" id="ally-ban-2"></div>
            <div class="ban-slot"><input type="text" placeholder="Hero 3" id="ally-ban-3"></div>
            <div class="ban-slot"><input type="text" placeholder="Hero 4" id="ally-ban-4"></div>
        </div>
    </div>

    <div class="section card">
        <div class="section-title">ENEMY BANS</div>
        <div class="ban-slots">
            <div class="ban-slot"><input type="text" placeholder="Hero 1" id="enemy-ban-1"></div>
            <div class="ban-slot"><input type="text" placeholder="Hero 2" id="enemy-ban-2"></div>
            <div class="ban-slot"><input type="text" placeholder="Hero 3" id="enemy-ban-3"></div>
            <div class="ban-slot"><input type="text" placeholder="Hero 4" id="enemy-ban-4"></div>
        </div>
    </div>

    <div class="section">
        <div class="picks-container">
            <div class="picks-column">
                <div class="section-title">ALLY PICKS</div>
                <input type="text" placeholder="Pick 1" id="ally-pick-1">
                <input type="text" placeholder="Pick 2" id="ally-pick-2">
                <input type="text" placeholder="Pick 3" id="ally-pick-3">
                <input type="text" placeholder="Pick 4" id="ally-pick-4">
                <input type="text" placeholder="Pick 5" id="ally-pick-5">
            </div>
            <div class="picks-column">
                <div class="section-title">ENEMY PICKS</div>
                <input type="text" placeholder="Pick 1" id="enemy-pick-1">
                <input type="text" placeholder="Pick 2" id="enemy-pick-2">
                <input type="text" placeholder="Pick 3" id="enemy-pick-3">
                <input type="text" placeholder="Pick 4" id="enemy-pick-4">
                <input type="text" placeholder="Pick 5" id="enemy-pick-5">
            </div>
        </div>
    </div>

    <button class="analyze-btn" id="analyze-btn" onclick="analyzeDraft()">>> ANALYZE DRAFT <<</button>

    <div class="spinner" id="spinner"></div>

    <div class="results" id="results">
        <div class="section">
            <div class="section-title">>> OPTIMAL PICK VECTORS <<</div>
            <div id="hero-recommendations"></div>
        </div>

        <div class="section matchup-section">
            <div class="matchup-title">>> MATCHUP PROBABILITY <<</div>
            <div class="win-progress">
                <div class="win-fill" id="win-bar">0%</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        function getInputValue(id) {
            return document.getElementById(id).value.trim();
        }

        function getAllInputs(prefix, count) {
            const results = [];
            for (let i = 1; i <= count; i++) {
                const val = getInputValue(`${prefix}-${i}`);
                if (val) results.push(val);
            }
            return results;
        }

        function loadDraftFromStorage() {
            const saved = localStorage.getItem('mlbb-last-draft');
            if (!saved) return;
            try {
                const draft = JSON.parse(saved);
                if (draft.allyBans) draft.allyBans.forEach((h, i) => {
                    if (document.getElementById(`ally-ban-${i+1}`)) 
                        document.getElementById(`ally-ban-${i+1}`).value = h;
                });
                if (draft.enemyBans) draft.enemyBans.forEach((h, i) => {
                    if (document.getElementById(`enemy-ban-${i+1}`)) 
                        document.getElementById(`enemy-ban-${i+1}`).value = h;
                });
                if (draft.allyPicks) draft.allyPicks.forEach((h, i) => {
                    if (document.getElementById(`ally-pick-${i+1}`)) 
                        document.getElementById(`ally-pick-${i+1}`).value = h;
                });
                if (draft.enemyPicks) draft.enemyPicks.forEach((h, i) => {
                    if (document.getElementById(`enemy-pick-${i+1}`)) 
                        document.getElementById(`enemy-pick-${i+1}`).value = h;
                });
            } catch(e) { console.error('Failed to load draft:', e); }
        }

        function saveDraftToStorage() {
            const draft = {
                allyBans: getAllInputs('ally-ban', 4),
                enemyBans: getAllInputs('enemy-ban', 4),
                allyPicks: getAllInputs('ally-pick', 5),
                enemyPicks: getAllInputs('enemy-pick', 5)
            };
            localStorage.setItem('mlbb-last-draft', JSON.stringify(draft));
        }

        function getRoleBadgeClass(role) {
            const roles = ['Tank', 'Fighter', 'Assassin', 'Marksman', 'Mage', 'Support'];
            for (const r of roles) {
                if (role.toLowerCase().includes(r.toLowerCase())) return `role-${r}`;
            }
            return 'role-Mage';
        }

        function displayResults(data) {
            const container = document.getElementById('hero-recommendations');
            container.innerHTML = '';

            data.forEach((hero, idx) => {
                const card = document.createElement('div');
                card.className = 'hero-card';
                card.style.animationDelay = `${idx * 0.1}s`;

                const role = hero.breakdown?.role || 'Mage';
                const score = Math.round(hero.total_score || 0);
                const breakdown = hero.breakdown || {};

                card.innerHTML = `
                    <div class="hero-name">${hero.name}</div>
                    <div class="role-badge ${getRoleBadgeClass(role)}">${role.toUpperCase()}</div>
                    <div class="score-bar">
                        <div class="score-fill" style="width: 0%" data-width="${score}%"></div>
                    </div>
                    <div class="breakdown">
                        <div class="breakdown-item">WR: ${(breakdown.win_rate || 0).toFixed(1)}%</div>
                        <div class="breakdown-item">Counter: ${(breakdown.counter || 0).toFixed(1)}</div>
                        <div class="breakdown-item">Synergy: ${(breakdown.synergy || 0).toFixed(1)}</div>
                        <div class="breakdown-item">Comp: ${(breakdown.composition || 0).toFixed(1)}</div>
                    </div>
                `;
                container.appendChild(card);

                setTimeout(() => {
                    const fill = card.querySelector('.score-fill');
                    fill.style.width = fill.dataset.width;
                }, 100 + idx * 100);
            });

            const winChance = data.length > 0 ? Math.round(data[0].total_score || 50) : 50;
            const winBar = document.getElementById('win-bar');
            winBar.style.width = '0%';
            setTimeout(() => {
                winBar.style.width = winChance + '%';
                winBar.textContent = winChance + '%';
            }, 200);

            document.getElementById('results').classList.add('visible');
        }

        async function analyzeDraft() {
            const btn = document.getElementById('analyze-btn');
            const spinner = document.getElementById('spinner');
            const results = document.getElementById('results');

            const allyPicks = getAllInputs('ally-pick', 5);
            const enemyPicks = getAllInputs('enemy-pick', 5);
            const banned = [...getAllInputs('ally-ban', 4), ...getAllInputs('enemy-ban', 4)];

            saveDraftToStorage();

            btn.disabled = true;
            spinner.classList.add('visible');
            results.classList.remove('visible');

            try {
                const response = await fetch(`${API_URL}/draft/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ally_picks: allyPicks,
                        enemy_picks: enemyPicks,
                        banned: banned
                    })
                });

                if (!response.ok) throw new Error('Failed to analyze draft');

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to analyze draft. Please check the server.');
            } finally {
                btn.disabled = false;
                spinner.classList.remove('visible');
            }
        }

        loadDraftFromStorage();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js')
                .catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
